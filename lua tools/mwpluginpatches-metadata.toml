[package]
name = "mwpluginpatches"
description = "Unified targeted patches for specific plugins. Each patch defaults to enabled only if its target is active: Morrowind Comes Alive and Ebonheart Underworks silent auto-config; Privileges & Services guard-call, fade, and target-topic fixes; YARR Ysmir combat shield (Nord bubble only while fighting); Friends & Frens Jiub companion delayer and restored generic dialogue for converted vanilla NPCs; The Lost Heir delayer (people and creatures wait until Mehra Milo vanishes); Mabrigash Distribution startup-popup suppression; Clean Tales of Seyda Neen illegible-handwriting filter; Trainer Log auto-unlock of training topics; Seyda Neen Coast Guard bulk contraband turn-in; Graphic Herbalism multi-day herb respawn delay; Bardic Inspiration musical-instrument whitelist; Voices of Vvardenfell routine console-line suppression; UI Expansion topic colours wait until the topic list exists; Personal Effects Census and Excise scripts run in Lua."
category = "Bug Fixes"
author = "Antigravity"

[tools.mwse]
lua-mod = "mwsuite.mwpluginpatches"
load-priority = 4500
